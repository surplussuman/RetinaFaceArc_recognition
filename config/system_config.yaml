attendance:
  auto_absent_hours: 24
  confirmation_frames: 3
  duplicate_threshold_seconds: 300
  log_dir: data/logs/
  log_fields:
  - timestamp
  - user_id
  - name
  - confidence
  - track_id
  - frame_number
  - camera_id
  log_filename_format: attendance_%Y%m%d.csv
  log_format: csv
bytetrack:
  frame_rate: 30
  match_thresh: 0.8
  track_buffer: 30
  track_thresh: 0.6
camera_zone:
  box_color:
  - 0
  - 255
  - 0
  box_thickness: 3
  enabled: true
  max_distance_outside: 200
  track_outside_zone: true
  visualize: true
  zones:
  - enabled: true
    name: Zone 1
    roi:
    - 500
    - 480
    - 1040
    - 600
debug:
  enable: false
  output_dir: data/debug/
  save_alignments: false
  save_detections: false
  save_embeddings: false
  show_timing: true
  verbose: false
error_handling:
  continue_on_error: true
  error_log: data/logs/errors.log
  log_errors: true
  max_retries: 3
frame_processing:
  max_detection_resolution:
    height: 360
    width: 640
  process_every_n_frames: 5
ghost_tracking:
  cache_timeout: 60
  confidence_decay: 0.98
  enable: true
  motion_threshold: 50
  recognition_interval: 30
  rerecognize_on_motion: false
logging:
  format: '[{time:YYYY-MM-DD HH:mm:ss}] {level} | {message}'
  level: INFO
  log_file: data/logs/system.log
  log_to_file: true
  retention: 30 days
  rotation: 10 MB
multi_camera:
  cameras: []
  cross_camera_reid: true
  enable: false
  reid_threshold: 0.55
performance:
  batch_size: 4
  benchmark: false
  device: cuda:0
  fp16: false
  profile: false
  use_tensorrt: false
recognition:
  lenient_threshold: 0.35
  min_confidence: 0.35
  strict_threshold: 0.5
  threshold: 0.4
  unknown_label: Unknown
security:
  api_key: null
  enable_access_control: false
  encrypt_data: false
  require_auth: false
sort:
  iou_threshold: 0.3
  max_age: 30
  min_hits: 3
statistics:
  enable: true
  metrics:
  - fps
  - num_faces_detected
  - num_faces_recognized
  - avg_confidence
  - processing_time
  save_stats: true
  stats_file: data/logs/statistics.json
  update_interval: 10
supermarket:
  density:
    alert_threshold: 15
    enable: true
    grid_size:
    - 10
    - 10
  dwell_time:
    enable: true
    min_dwell_seconds: 5
    zones: []
  enable_reid: true
  enable_tracking: true
  entry_exit:
    enable: true
    entry_line: null
    exit_line: null
  heatmap:
    decay_factor: 0.95
    enable: true
    resolution:
    - 640
    - 480
temporal:
  aggregation: mean
  ema_alpha: 0.3
  enable: true
  max_history: 30
  min_confirmation_frames: 3
  window_size: 5
tracking:
  algorithm: bytetrack
  appearance_threshold: 0.5
  iou_threshold: 0.3
  max_age: 30
  min_hits: 3
  track_id:
    reset_on_restart: false
    start_id: 1
  use_appearance: true
video:
  buffer_size: 10
  frame_skip: 1
  num_workers: 2
  resize_frame: false
  target_size:
  - 1280
  - 720
  use_threading: true
visualization:
  bbox_color:
  - 0
  - 255
  - 0
  bbox_thickness: 2
  color_by_identity: true
  enable: true
  font_scale: 0.6
  font_thickness: 2
  label_position: top
  landmark_color:
  - 255
  - 0
  - 0
  landmark_radius: 2
  show_bbox: true
  show_confidence: true
  show_fps: true
  show_labels: true
  show_landmarks: true
  show_track_id: true
  unknown_color:
  - 128
  - 128
  - 128
