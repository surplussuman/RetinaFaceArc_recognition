# ArcFace Embedding Configuration
# Angular margin softmax for face recognition

model:
  name: "arcface_resnet100"
  path: "models/arcface_resnet100.onnx"
  backbone: "resnet100"  # Options: resnet50, resnet100, mobilefacenet
  
  # Alternative models
  # name: "arcface_resnet50"
  # path: "models/arcface_resnet50.onnx"
  # backbone: "resnet50"
  
  # name: "arcface_mobilefacenet"
  # path: "models/arcface_mobilefacenet.onnx"
  # backbone: "mobilefacenet"

# Embedding parameters
embedding:
  # Embedding dimension (standard is 512)
  dimension: 512
  
  # L2 normalization (required for cosine similarity)
  normalize: true
  
  # Embedding post-processing
  postprocess:
    flip_test: false  # Test-time augmentation (horizontal flip + average)
    center_crop: false

# ArcFace loss parameters (for reference / training)
arcface:
  # Angular margin (radians)
  # Controls inter-class separation
  # Typical range: 0.4 - 0.6
  margin: 0.5  # m parameter
  
  # Scaling factor
  # Amplifies gradients and prevents saturation
  # Typical range: 32 - 64
  scale: 64.0  # s parameter
  
  # Easy margin (for easier optimization)
  easy_margin: false

# Input preprocessing
preprocessing:
  # Target input size (width, height)
  # Standard sizes: [112, 112] or [160, 160]
  input_size: [112, 112]
  
  # Mean and std for normalization
  # RGB order
  mean: [127.5, 127.5, 127.5]
  std: [127.5, 127.5, 127.5]
  
  # Pixel value range: [-1, 1] or [0, 1]
  pixel_scale: 127.5
  pixel_bias: -1.0
  
  # Color format
  color_format: "RGB"  # Model expects RGB

# Quality control
quality:
  # Minimum face size before alignment
  min_face_size: 20
  
  # Minimum landmark quality score
  min_landmark_quality: 0.5
  
  # Blur detection
  check_blur: true
  blur_threshold: 15.0  # Lowered from 100.0 for old/low-quality photos (Laplacian variance)
  
  # Brightness check
  check_brightness: true
  brightness_range: [20, 235]
  
  # Face angle limits (degrees)
  max_yaw: 45
  max_pitch: 30
  max_roll: 30

# Performance optimization
optimization:
  # Use ONNX Runtime execution providers
  execution_providers:
    - "CPUExecutionProvider"  # GPU causes OOM with 4GB VRAM
  
  # CUDA options
  cuda:
    device_id: 0
    cudnn_conv_algo_search: "DEFAULT"
    
  # Session options
  session:
    intra_op_num_threads: 0   # 0 = use all available cores (was 4 -> capped at 4 cores)
    inter_op_num_threads: 0   # 0 = let ORT decide
    graph_optimization_level: "ORT_ENABLE_ALL"
    
  # Enable FP16 inference (if supported)
  enable_fp16: false

# Batch processing
batch:
  enable: true
  max_batch_size: 32
  dynamic_batching: true
  timeout_ms: 100

# Debugging
debug:
  save_aligned_faces: false
  log_inference_time: true
  verbose: false

# Training configuration (optional, for reference)
training:
  # Dataset parameters
  num_classes: null  # Set based on training dataset
  samples_per_class: 50
  
  # Optimizer
  optimizer: "sgd"
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  
  # Learning rate schedule
  lr_schedule:
    type: "multistep"
    milestones: [20000, 28000, 32000]
    gamma: 0.1
  
  # Training parameters
  batch_size: 128
  num_epochs: 35
  
  # Data augmentation
  augmentation:
    horizontal_flip: true
    random_crop: false
    color_jitter: true
    random_erasing: false
    mixup: false
    
  # Validation
  validation:
    datasets:
      - "lfw"
      - "cfp_fp"
      - "agedb_30"
    frequency: 2000  # steps
